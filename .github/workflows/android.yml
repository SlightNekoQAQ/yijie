name: Android APK
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Rules tests
        run: node --test tests/*.test.js
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: android-actions/setup-android@v4
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.10.2"
      - name: Install Android SDK
        run: sdkmanager 'platforms;android-35' 'build-tools;35.0.0'
      - name: Restore signing key
        env:
          YIJIE_KEYSTORE_BASE64: ${{ secrets.YIJIE_KEYSTORE_BASE64 }}
        run: |
          test -n "$YIJIE_KEYSTORE_BASE64"
          printf '%s' "$YIJIE_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/yijie.p12"
      - name: Build installable debug APK
        env:
          YIJIE_KEYSTORE_PATH: ${{ runner.temp }}/yijie.p12
          YIJIE_STORE_PASSWORD: ${{ secrets.YIJIE_STORE_PASSWORD }}
        run: gradle --no-daemon :app:assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: yijie-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
