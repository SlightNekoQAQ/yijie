plugins { id 'com.android.application' }

android {
    namespace 'com.yijie.game'
    compileSdk 35
    defaultConfig {
        applicationId 'com.yijie.game'
        minSdk 24
        targetSdk 34
        versionCode 3
        versionName '0.3.0'
    }
    signingConfigs {
        if (System.getenv('YIJIE_KEYSTORE_PATH')) {
            ci {
                storeFile file(System.getenv('YIJIE_KEYSTORE_PATH'))
                storeType 'pkcs12'
                storePassword System.getenv('YIJIE_STORE_PASSWORD')
                keyAlias 'yijie'
                keyPassword System.getenv('YIJIE_STORE_PASSWORD')
            }
        }
    }
    buildTypes {
        debug {
            if (System.getenv('YIJIE_KEYSTORE_PATH')) signingConfig signingConfigs.ci
        }
        release { minifyEnabled false }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
